<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>For Sale Poster - Isuzu KB300</title>
<style>
  @page {
    size: A4 landscape;
    margin: 12mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eee;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .poster {
    background: #fff;
    width: 277mm;
    height: 190mm;
    padding: 10mm 16mm;
    border: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    text-align: center;
  }
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    width: 100%;
  }
  .left {
    flex: 1.3;
    text-align: left;
  }
  .right {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  .for-sale {
    font-size: 90px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #000;
    margin: 0;
    line-height: 1;
  }
  .model {
    font-size: 46px;
    font-weight: 700;
    margin: 10px 0 2px;
  }
  .subtitle {
    font-size: 26px;
    color: #444;
    margin: 0 0 18px;
  }
  .price {
    font-size: 80px;
    font-weight: 900;
    color: #000;
    margin: 0 0 20px;
    line-height: 1;
  }
  .specs {
    font-size: 28px;
    line-height: 1.9;
  }
  .specs strong {
    display: inline-block;
    min-width: 210px;
    text-align: right;
    margin-right: 10px;
    color: #444;
    font-weight: 600;
  }
  .qr img {
    width: 320px;
    height: 320px;
  }
  .qr-label {
    font-size: 17px;
    color: #666;
    margin-top: 8px;
  }
  .phone {
    background: transparent;
    color: #000;
    border: 4px solid #000;
    padding: 14px 0;
    border-radius: 10px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 20px;
  }
  .phone-label {
    font-size: 26px;
    font-weight: 600;
  }
  .phone-number {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .print-btn {
    margin: 20px 0;
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .poster { border: none; }
    .print-btn { display: none; }
  }
</style>
</head>
<body>
<div>
  <button class="print-btn" onclick="window.print()">Print poster</button>
  <div class="poster">
    <div class="for-sale">FOR SALE</div>

    <div class="main">
      <div class="left">
        <div class="model">Isuzu KB300 LX</div>
        <div class="subtitle">2004 &middot; Double Cab Bakkie</div>
        <div class="price">R120,000</div>

        <div class="specs">
          <div><strong>Mileage:</strong> 342,000 km</div>
          <div><strong>Service History:</strong> Full</div>
          <div><strong>Accidents:</strong> None</div>
        </div>
      </div>

      <div class="right">
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://intuitably.com/isuzu/" alt="QR code to full ad">
          <div class="qr-label">Scan for full details &amp; photos</div>
        </div>
      </div>
    </div>

    <div class="phone">
      <div class="phone-label">Call or WhatsApp</div>
      <div class="phone-number">083 564 8926</div>
    </div>
  </div>
</div>
</body>
</html>
