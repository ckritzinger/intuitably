<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Happy Birthday Christelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff2fb0;
    --cyan:#00d8e0;
    --lime:#c6ff2f;
    --tangerine:#ff8a1e;
    --violet:#9b3cff;
    --red:#ff3b3b;
    --gold:#ffcc00;
    --ink:#111111;
    --paper:#fffdf6;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
  }
  img{display:block;max-width:100%;}

  .display{
    font-family:'Titan One',cursive;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .outline-ink{
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }

  /* ---------- Marquee hero ---------- */
  .marquee{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6rem 1.5rem 4rem;
    overflow:hidden;
    background:
      repeating-linear-gradient(
        115deg,
        var(--pink) 0 9%,
        var(--tangerine) 9% 18%,
        var(--gold) 18% 27%,
        var(--lime) 27% 36%,
        var(--cyan) 36% 45%,
        var(--violet) 45% 54%,
        var(--red) 54% 63%
      );
    background-size:220% 220%;
    animation: shift 14s ease-in-out infinite alternate;
    border-bottom:6px solid var(--ink);
  }
  @keyframes shift{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
  }
  .bunting{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-evenly;
    z-index:1;
    pointer-events:none;
  }
  .bunting svg{ width:44px; height:auto; filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)); }

  .sparkle{
    position:absolute;
    pointer-events:none;
    z-index:1;
  }

  .marquee-card{
    position:relative;
    z-index:2;
    background:var(--paper);
    border:5px solid var(--ink);
    border-radius:28px;
    padding:3rem clamp(1.25rem, 5vw, 4rem);
    box-shadow: 14px 14px 0 var(--ink);
    width:100%;
    max-width:920px;
    transform:rotate(-1.2deg);
  }
  .eyebrow-free-title{
    font-size:clamp(2.6rem, 9vw, 6rem);
    margin:0;
    color:var(--pink);
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }
  .title-line2{
    display:block;
    color:var(--cyan);
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }
  .milestone{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.1rem, 2.6vw, 1.6rem);
    margin:1.25rem 0 0;
    color:var(--ink);
    background:var(--gold);
    display:inline-block;
    padding:0.4rem 1.4rem;
    border:3px solid var(--ink);
    border-radius:999px;
    transform:rotate(1.5deg);
  }
  .lede{
    font-size:clamp(1rem, 2vw, 1.2rem);
    max-width:52ch;
    margin:1.5rem auto 0;
    font-weight:700;
  }

  .confetti-btn{
    margin-top:2.25rem;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:1.3rem;
    letter-spacing:0.02em;
    color:var(--ink);
    background:var(--lime);
    border:4px solid var(--ink);
    border-radius:16px;
    padding:1rem 2.4rem;
    cursor:pointer;
    box-shadow:8px 8px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
  }
  .confetti-btn svg{ width:22px; height:22px; flex-shrink:0; }
  .confetti-btn:hover{
    transform:translate(-3px,-3px);
    box-shadow:11px 11px 0 var(--ink);
  }
  .confetti-btn:active{
    transform:translate(4px,4px);
    box-shadow:4px 4px 0 var(--ink);
  }
  .confetti-btn:focus-visible{
    outline:3px solid var(--ink);
    outline-offset:4px;
  }

  .signoff{
    margin:2rem 0 0;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.4rem;
    flex-wrap:wrap;
  }
  .signoff svg{ width:16px; height:auto; flex-shrink:0; }

  /* ---------- Confetti pieces ---------- */
  .confetti-piece{
    position:fixed;
    top:-24px;
    width:12px;
    height:18px;
    z-index:999;
    pointer-events:none;
    will-change:transform, opacity;
    animation-name:fall;
    animation-timing-function:cubic-bezier(.35,0,.65,1);
    animation-fill-mode:forwards;
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 108vh) rotate(var(--spin)); opacity:1; }
  }

  ::selection{ background:var(--pink); color:var(--paper); }

  html{
    scrollbar-color: var(--pink) var(--paper);
    scrollbar-width: thin;
  }
  ::-webkit-scrollbar{ width:14px; }
  ::-webkit-scrollbar-track{ background:var(--paper); }
  ::-webkit-scrollbar-thumb{
    background:var(--pink);
    border-radius:8px;
    border:3px solid var(--paper);
  }
  ::-webkit-scrollbar-thumb:hover{ background:var(--cyan); }

  @media (prefers-reduced-motion: reduce){
    .marquee{ animation:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<header class="marquee">
  <div class="bunting" aria-hidden="true">
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#ff2fb0" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#00d8e0" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#ffcc00" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#c6ff2f" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#ff8a1e" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#9b3cff" stroke="#111" stroke-width="2"/></svg>
    <svg viewBox="0 0 20 26"><polygon points="0,0 20,0 10,26" fill="#ff3b3b" stroke="#111" stroke-width="2"/></svg>
  </div>

  <svg class="sparkle" style="top:14%;left:8%;width:34px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#111" stroke-width="1.5"/></svg>
  <svg class="sparkle" style="top:66%;right:9%;width:26px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#111" stroke-width="1.5"/></svg>
  <svg class="sparkle" style="top:10%;right:14%;width:20px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#fff" stroke="#111" stroke-width="1.5"/></svg>

  <div class="marquee-card">
    <h1 class="display eyebrow-free-title">
      HAPPY BIRTHDAY
      <span class="title-line2">CHRISTELLE</span>
    </h1>
    <p class="milestone">Another glorious loop around the sun</p>
    <p class="lede">Chess hustler. Craft hoarder. Book devourer. Squirrel diplomat. Weed whisperer. Pet magnet. Dirt-under-the-nails gardener. Hope you have a fantastic day and year!</p>
    <button class="confetti-btn" id="confettiBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21 L9 9" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><rect x="11" y="3" width="4" height="4" rx="1" fill="#ff2fb0" stroke="#111" stroke-width="1.6" transform="rotate(20 13 5)"/><rect x="17" y="8" width="4" height="4" rx="1" fill="#00d8e0" stroke="#111" stroke-width="1.6" transform="rotate(-15 19 10)"/><circle cx="8" cy="4" r="2.1" fill="#ffcc00" stroke="#111" stroke-width="1.6"/><circle cx="20" cy="17" r="2.1" fill="#c6ff2f" stroke="#111" stroke-width="1.6"/></svg>
      HIT THE CONFETTI
    </button>
    <p class="signoff">
      Made with
      <svg viewBox="0 0 24 21" aria-hidden="true"><path d="M12 20.5 C6 16 1 11.8 1 6.8 C1 3.4 3.6 1 6.7 1 C8.9 1 10.8 2.2 12 4 C13.2 2.2 15.1 1 17.3 1 C20.4 1 23 3.4 23 6.8 C23 11.8 18 16 12 20.5 Z" fill="#ff2fb0" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/></svg>
      from your Sedgefield Fam: Barbara, Carl, Luke and Max
    </p>
  </div>
</header>

<script>
(function(){
  var colors = ['#ff2fb0','#00d8e0','#c6ff2f','#ff8a1e','#9b3cff','#ff3b3b','#ffcc00'];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function burst(){
    if (reduceMotion) return;
    var count = 90;
    for (var i = 0; i < count; i++){
      (function(){
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        var color = colors[Math.floor(Math.random() * colors.length)];
        var isRound = Math.random() > 0.5;
        piece.style.background = color;
        piece.style.borderRadius = isRound ? '50%' : '2px';
        piece.style.left = (Math.random() * 100) + 'vw';
        var duration = 2.6 + Math.random() * 1.8;
        var delay = Math.random() * 0.4;
        var drift = (Math.random() * 220 - 110) + 'px';
        var spin = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540) + 'deg';
        piece.style.setProperty('--drift', drift);
        piece.style.setProperty('--spin', spin);
        piece.style.animationDuration = duration + 's';
        piece.style.animationDelay = delay + 's';
        document.body.appendChild(piece);
        setTimeout(function(){ piece.remove(); }, (duration + delay) * 1000 + 100);
      })();
    }
  }

  document.getElementById('confettiBtn').addEventListener('click', burst);

  window.addEventListener('load', function(){
    setTimeout(burst, 350);
  });
})();
</script>

</body>
</html>
